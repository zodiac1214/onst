# Backup workflow for manual updates and troubleshooting
name: Manual Data Update

on:
  # Allows manual triggering with optional parameters
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if no changes detected'
        required: false
        default: false
        type: boolean
      debug_mode:
        description: 'Enable debug output'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  manual-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Debug - Show current files
        if: ${{ inputs.debug_mode == 'true' }}
        run: |
          echo "Current directory contents:"
          ls -la
          echo "Current index.html size:"
          wc -l index.html || echo "index.html not found"
      
      - name: Fetch latest rainbow trout data
        run: |
          echo "🐟 Manually fetching latest rainbow trout stocking data..."
          python3 fetch_trout_data.py
      
      - name: Debug - Show API response info
        if: ${{ inputs.debug_mode == 'true' }}
        run: |
          echo "Updated index.html size:"
          wc -l index.html
          echo "Last 10 lines of index.html:"
          tail -10 index.html
      
      - name: Check for changes
        id: verify-changed-files
        run: |
          if git diff --quiet && [ "${{ inputs.force_update }}" != "true" ]; then
            echo "No changes detected and force_update is false"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            if [ "${{ inputs.force_update }}" == "true" ]; then
              echo "Force update requested"
            else
              echo "Data changes detected"
            fi
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Show git diff
        if: ${{ inputs.debug_mode == 'true' }}
        run: |
          echo "Git status:"
          git status
          echo "Git diff (first 50 lines):"
          git diff | head -50 || echo "No diff to show"
      
      - name: Commit updated HTML
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (Manual)"
          git add index.html
          if [ "${{ inputs.force_update }}" == "true" ]; then
            git commit -m "🔧 Manual force update of rainbow trout data - $(date '+%Y-%m-%d %H:%M:%S UTC')"
          else
            git commit -m "🐟 Manual update of rainbow trout stocking data - $(date '+%Y-%m-%d %H:%M:%S UTC')"
          fi
          git push
      
      - name: No changes message
        if: steps.verify-changed-files.outputs.changed == 'false'
        run: |
          echo "ℹ️ No changes detected in the rainbow trout data. The webpage is already up to date."
          echo "If you want to force an update anyway, re-run this workflow with 'force_update' set to true."