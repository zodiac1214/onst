# Automated Rainbow Trout Stocking Data Updater and Deployer
name: Update and Deploy Rainbow Trout Data

on:
  # Runs every hour to fetch fresh data
  schedule:
    - cron: '0 * * * *'  # Run at the start of every hour
  
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write  # Changed to write to allow committing updated HTML
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job to fetch fresh data and update HTML
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Fetch latest rainbow trout data
        run: |
          echo "🐟 Fetching latest rainbow trout stocking data..."
          python3 fetch_trout_data.py
      
      - name: Check for changes
        id: verify-changed-files
        run: |
          if git diff --quiet; then
            echo "No changes detected in the data"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Data changes detected"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit updated HTML
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git commit -m "🐟 Auto-update rainbow trout stocking data - $(date '+%Y-%m-%d %H:%M:%S UTC')"
          git push
      
      - name: Upload updated files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: updated-site
          path: |
            index.html
            fetch_trout_data.py
            README.md
            LICENSE

  # Job to deploy to GitHub Pages
  deploy:
    needs: update-data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main  # Ensure we get the latest commit with updated data
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload entire repository
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
